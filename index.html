<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Библиотека</title>
    <link rel="stylesheet" href="./style.css">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header class="header">
            <h1>📚 Моя Библиотека</h1>
            <button class="btn btn-primary" id="addBookBtn">+ Добавить</button>
        </header>

        <!-- Панель фильтров -->
        <div class="filters">
            <select id="typeFilter">
                <option value="">Все типы</option>
                <option value="book">Книги</option>
                <option value="game">Игры</option>
                <option value="movie">Фильмы</option>
                <option value="series">Сериалы</option>
            </select>
            
            <select id="statusFilter">
                <option value="">Все статусы</option>
                <option value="planned">В планах</option>
                <option value="in-progress">В процессе</option>
                <option value="completed">Завершено</option>
            </select>

            <input type="text" id="searchInput" placeholder="Поиск по названию...">
        </div>

        <!-- Контейнер для карточек -->
        <div class="books-grid" id="booksContainer">
            <!-- Сюда JavaScript вставит карточки -->
        </div>
    </div>

    <!-- Модальное окно для добавления/редактирования -->
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить в библиотеку</h2>
                <span class="close" id="closeModal">&times;</span>
            </div>
            <form id="bookForm">
                <input type="hidden" id="itemId">
                
                <div class="form-group">
                    <label for="title">Название *</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-group">
                    <label for="type">Тип *</label>
                    <select id="type" required>
                        <option value="">Выберите тип</option>
                        <option value="book">Книга</option>
                        <option value="game">Игра</option>
                        <option value="movie">Фильм</option>
                        <option value="series">Сериал</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="author">Автор/Разработчик *</label>
                    <input type="text" id="author" required>
                </div>

                <div class="form-group">
                    <label for="status">Статус *</label>
                    <select id="status" required>
                        <option value="">Выберите статус</option>
                        <option value="planned">В планах</option>
                        <option value="in-progress">В процессе</option>
                        <option value="completed">Завершено</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rating">Рейтинг (0-10)</label>
                    <input type="number" id="rating" min="0" max="10" value="0">
                </div>

                <div class="form-group">
                    <label for="image">Ссылка на обложку</label>
                    <input type="url" id="image">
                </div>

                <div class="form-group">
                    <label for="description">Описание</label>
                    <textarea id="description" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
